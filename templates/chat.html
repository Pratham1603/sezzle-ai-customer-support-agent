<!DOCTYPE html>
<html>
<head>
    <title>Sezzle Virtual Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>

    <style>
        :root {
            --sezzle-purple: #7A5AF8;
            --sezzle-purple-hover: #6342E8;
            --sezzle-light-purple: #F4F3FF;
            --bg-main: #F8F9FC;
            --card-bg: #FFFFFF;
            --text-dark: #1D2939;
            --text-muted: #667085;
            --border-color: #EAECF0;
            --font-body: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            height: 100%;
            font-family: var(--font-body);
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(122, 90, 248, 0.03) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(122, 90, 248, 0.02) 0%, transparent 40%);
            color: var(--text-dark);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .chat-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 24px;
        }

        .chat-card {
            width: 100%;
            max-width: 720px;
            height: 85vh;
            min-height: 550px;
            display: flex;
            flex-direction: column;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            box-shadow: 0 12px 32px -4px rgba(29, 41, 57, 0.05), 0 4px 12px -2px rgba(29, 41, 57, 0.02);
            overflow: hidden;
        }

        /* HEADER */
        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 28px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .header-left { display: flex; align-items: center; gap: 14px; }

        .avatar-wrap { position: relative; width: 44px; height: 44px; }

        .bot-avatar {
            width: 44px; height: 44px;
            border-radius: 12px;
            background: var(--sezzle-purple);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--card-bg);
            font-size: 20px;
        }

        .status-dot {
            position: absolute;
            bottom: -2px; right: -2px;
            width: 12px; height: 12px;
            background: #12B76A;
            border-radius: 50%;
            border: 2.5px solid var(--card-bg);
        }

        .header-info { display: flex; flex-direction: column; }

        .brand-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-dark);
            letter-spacing: -0.2px;
        }

        .brand-sub {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .header-badge {
            background: var(--sezzle-light-purple);
            color: var(--sezzle-purple);
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
            letter-spacing: 0.3px;
        }

        /* CHAT BODY */
        .chat-body {
            flex: 1;
            overflow-y: auto;
            padding: 32px 28px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            background: #FCFCFD;
        }

        .chat-body::-webkit-scrollbar { width: 6px; }
        .chat-body::-webkit-scrollbar-thumb { background: #D0D5DD; border-radius: 10px; }
        .chat-body::-webkit-scrollbar-track { background: transparent; }

        /* MESSAGES */
        .msg-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
            max-width: 85%;
        }
        .bot-row { justify-content: flex-start; align-self: flex-start; }
        .user-row { justify-content: flex-end; align-self: flex-end; flex-direction: row-reverse; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .msg-avatar { width: 32px; height: 32px; flex-shrink: 0; }
        
        .msg-avatar-icon {
            width: 32px; height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .bot-avatar-msg { background: var(--sezzle-purple); color: white; }
        .user-avatar-msg { background: #F2F4F7; color: var(--text-dark); }

        .msg-bubble {
            padding: 14px 18px;
            font-size: 14px;
            line-height: 1.6;
            position: relative;
            box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05);
        }

        .bot-bubble {
            background: var(--card-bg);
            color: var(--text-dark);
            border-radius: 0px 16px 16px 16px;
            border: 1px solid var(--border-color);
        }

        .user-bubble {
            background: var(--sezzle-purple);
            color: var(--card-bg);
            border-radius: 16px 0px 16px 16px;
            font-weight: 400;
        }

        .msg-time {
            display: block;
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 6px;
        }
        .user-bubble .msg-time { color: rgba(255,255,255,0.7); }

        /* MULTI-STEP MENU UI */
        .welcome-title {
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .quick-help-list {
            margin-top: 12px;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .quick-help-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .quick-help-item:hover {
            background: var(--sezzle-light-purple);
            border-color: var(--sezzle-purple);
            color: var(--sezzle-purple);
        }

        .quick-help-item i {
            font-size: 14px;
            color: var(--text-muted);
        }
        .quick-help-item:hover i { color: var(--sezzle-purple); }

        /* TYPING INDICATOR */
        .typing-bubble {
            padding: 14px 20px !important;
            display: flex !important;
            align-items: center;
            gap: 4px;
            min-width: 64px;
        }

        .dot {
            width: 6px; height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            display: inline-block;
            animation: blink 1.4s infinite both;
        }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0.3; transform: scale(0.9); }
            40% { opacity: 1; transform: scale(1.1); }
        }

        /* PRODUCT / TRANSACTION CARD */
        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            max-width: 280px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 12px rgba(16, 24, 40, 0.04);
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .product-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .product-img {
            width: 100%;
            height: auto;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            display: block;
        }

        .shop-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--sezzle-purple);
            color: var(--card-bg) !important;
            font-size: 13px;
            font-weight: 500;
            padding: 10px 16px;
            border-radius: 8px;
            text-decoration: none !important;
            transition: background 0.2s ease;
        }

        .shop-btn:hover {
            background: var(--sezzle-purple-hover);
        }

        /* FOOTER / INPUT */
        .chat-footer {
            background: var(--card-bg);
            padding: 18px 28px 14px;
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .input-row {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            border-radius: 10px;
            border: 1px solid #D0D5DD;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .input-row:focus-within {
            border-color: var(--sezzle-purple);
            box-shadow: 0 0 0 4px rgba(122, 90, 248, 0.12);
        }

        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-dark);
            font-family: var(--font-body);
            font-size: 14px;
            padding: 14px 18px;
        }

        .chat-input::placeholder { color: #98A2B3; }

        .send-btn {
            background: transparent;
            border: none;
            color: var(--sezzle-purple);
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .send-btn:hover { color: var(--sezzle-purple-hover); background: var(--sezzle-light-purple); }

        .footer-note {
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .chat-wrapper { padding: 0; }
            .chat-card { height: 100vh; border-radius: 0; border: none; }
            .chat-body { padding: 20px 16px; }
            .chat-footer { padding: 14px 16px 12px; }
        }
    </style>
</head>

<body>
    <div class="chat-wrapper">
        <div class="chat-card">

            <div class="chat-header">
                <div class="header-left">
                    <div class="avatar-wrap">
                        <div class="bot-avatar">
                            <i class="fas fa-shield-alt"></i>
                        </div>
                        <span class="status-dot"></span>
                    </div>
                    <div class="header-info">
                        <span class="brand-name">Sezzle Assistant</span>
                        <span class="brand-sub">AI Support Agent</span>
                    </div>
                </div>
                <div class="header-badge">
                    <i class="fas fa-check-circle"></i> VERIFIED
                </div>
            </div>

            <div id="messageFormeight" class="chat-body">
                <div class="msg-row bot-row">
                    <div class="msg-avatar">
                        <div class="msg-avatar-icon bot-avatar-msg">
                            <i class="fas fa-robot"></i>
                        </div>
                    </div>
                    <div class="msg-bubble bot-bubble">
                        <div class="welcome-title">Hi there! 👋</div>
                        I'm your Sezzle Virtual Assistant. How can I assist you with your payments or account today?
                        
                        <ul class="quick-help-list">
                            <li class="quick-help-item" onclick="handleQuickSelect('Check my order status')">
                                <i class="fas fa-shopping-bag"></i> Check my order status
                            </li>
                            <li class="quick-help-item" onclick="handleQuickSelect('Reschedule a payment')">
                                <i class="fas fa-calendar-alt"></i> Reschedule a payment
                            </li>
                            <li class="quick-help-item" onclick="handleQuickSelect('Update payment method')">
                                <i class="fas fa-credit-card"></i> Update payment method
                            </li>
                        </ul>
                        <span class="msg-time">NOW</span>
                    </div>
                </div>
            </div>

            <div class="chat-footer">
                <form id="messageArea" class="input-row">
                    <input type="text" id="text" name="msg"
                        placeholder="Type your question here..."
                        autocomplete="off" class="chat-input" required/>
                    <button type="submit" id="send" class="send-btn">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>
                <p class="footer-note">Secure 256-bit SSL encrypted connection.</p>
            </div>

        </div>
    </div>

    <script>
    function handleQuickSelect(query) {
        $("#text").val(query);
        $("#messageArea").submit();
    }

    $(document).ready(function() {
        function scrollToBottom() {
            var el = document.getElementById("messageFormeight");
            el.scrollTop = el.scrollHeight;
        }

        function timeNow() {
            const d = new Date();
            return d.getHours() + ":" + d.getMinutes().toString().padStart(2,'0');
        }

        var botAvatarSVG = `<div class="msg-avatar-icon bot-avatar-msg"><i class="fas fa-robot"></i></div>`;
        var userAvatarSVG = `<div class="msg-avatar-icon user-avatar-msg"><i class="fas fa-user"></i></div>`;

        $("#messageArea").on("submit", function(event) {
            event.preventDefault();

            const t = timeNow();
            var rawText = $("#text").val();
            if (!rawText.trim()) return;

            var userHtml =
                '<div class="msg-row user-row">' +
                '<div class="msg-avatar">' + userAvatarSVG + '</div>' +
                '<div class="msg-bubble user-bubble">' + rawText +
                '<span class="msg-time">' + t + '</span></div>' +
                '</div>';

            $("#text").val("");
            $("#messageFormeight").append(userHtml);
            scrollToBottom();

            // Typing indicator
            $("#messageFormeight").append(
                '<div class="msg-row bot-row" id="typing-indicator">' +
                '<div class="msg-avatar">' + botAvatarSVG + '</div>' +
                '<div class="msg-bubble bot-bubble typing-bubble">' +
                '<span class="dot"></span><span class="dot"></span><span class="dot"></span>' +
                '</div></div>'
            );
            scrollToBottom();

            $.ajax({
                data: { msg: rawText },
                type: "POST",
                url: "/get",
            }).done(function(data) {

                $("#typing-indicator").remove();

                $("#messageFormeight").append(
                    '<div class="msg-row bot-row">' +
                    '<div class="msg-avatar">' + botAvatarSVG + '</div>' +
                    '<div class="msg-bubble bot-bubble">' + data.answer +
                    '<span class="msg-time">' + t + '</span></div></div>'
                );

                if (data.image) {
                    $("#messageFormeight").append(
                        '<div class="msg-row bot-row">' +
                        '<div class="msg-avatar" style="visibility:hidden">' + botAvatarSVG + '</div>' +
                        '<div class="product-card">' +
                        (data.title ? '<div class="product-title">' + data.title + '</div>' : '') +
                        '<a href="' + data.image + '" target="_blank">' +
                        '<img src="' + data.image + '" class="product-img"></a>' +
                        (data.url ? '<a href="' + data.url + '" target="_blank" class="shop-btn">View Details <i class="fas fa-arrow-right"></i></a>' : '') +
                        '</div></div>'
                    );
                }

                scrollToBottom();
            });
        });
    });
    </script>
</body>
</html>

```
